<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" fill="none">
  <!-- Icon Group: Magnifying Glass + Analytics Bar Chart + Quality Checkmark -->
  <g id="datalens-icon">
    <!-- Magnifying Glass Lens Outer Ring -->
    <circle cx="48" cy="48" r="30" stroke="#1E3A8A" stroke-width="6" fill="none" />
    
    <!-- Magnifying Glass Handle -->
    <path d="M 69 69 L 90 90" stroke="#2563EB" stroke-width="8" stroke-linecap="round" />
    
    <!-- Bar 1 (Left Analytics Bar) -->
    <rect x="32" y="50" width="6" height="14" rx="2" fill="#2563EB" />
    
    <!-- Bar 2 (Middle Analytics Bar) -->
    <rect x="42" y="40" width="6" height="24" rx="2" fill="#2563EB" />
    
    <!-- Quality Checkmark (Integrated into the rightmost bar) -->
    <path d="M 50 49 L 56 55 L 68 35" stroke="#14B8A6" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography Group -->
  <g id="datalens-text">
    <!-- Main Product Title -->
    <text x="115" y="60" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-weight="800" font-size="44" fill="#1E3A8A" letter-spacing="-0.03em">
      Data<tspan fill="#2563EB">Lens</tspan>
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="117" y="88" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-weight="600" font-size="14" fill="#64748B" letter-spacing="0.12em" text-transform="uppercase">
      Investigate • Understand • Impact
    </text>
  </g>
</svg>
