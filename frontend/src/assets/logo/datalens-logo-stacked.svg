<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" width="320" height="230" fill="none">
  <!-- Official DataLens Stacked Brand Logo -->
  
  <!-- Centered Icon Group -->
  <g id="datalens-icon" transform="translate(100, 10)">
    <circle cx="55" cy="55" r="38" stroke="#1E3A8A" stroke-width="8" fill="none" />
    <path d="M 83 83 L 110 110" stroke="#1E3A8A" stroke-width="12" stroke-linecap="round" />
    <rect x="29" y="69" width="8" height="14" rx="2" fill="#14B8A6" />
    <rect x="41" y="57" width="8" height="26" rx="2" fill="#0EA5E9" />
    <rect x="53" y="44" width="8" height="39" rx="2" fill="#2563EB" />
    <rect x="65" y="32" width="8" height="51" rx="2" fill="#1E3A8A" />
    <path d="M 34 53 L 44 63 L 60 44" stroke="#14B8A6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Centered Wordmark & Tagline -->
  <g id="datalens-branding">
    <text x="160" y="165" font-family="'Inter', 'Geist', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-weight="800" font-size="46" fill="#1E3A8A" letter-spacing="-0.03em" text-anchor="middle">
      Data<tspan fill="#2563EB">Lens</tspan>
    </text>
    
    <text x="160" y="198" font-family="'Inter', 'Geist', -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-weight="600" font-size="13" fill="#64748B" letter-spacing="0.1em" text-anchor="middle">
      Investigate • Understand • Impact
    </text>
  </g>
</svg>
